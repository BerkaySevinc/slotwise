openapi: 3.1.0
info:
  title: Slotwise API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Multi-tenant appointment booking API.

    **Authentication.** Owners and staff sign in directly with Amazon Cognito; this API has no login endpoint (ADR-0007). Authenticated calls send the Cognito JWT as a bearer token. The tenant id and role are read from the verified token, never from the path, query or body.

    **Users without a tenant.** A newly verified owner has a token without a tenant. That token is accepted only by `POST /tenants`; every other authenticated endpoint rejects it with `403 tenant_required`.

    **Errors.** Errors returned by the application use the `Error` schema. Responses produced by API Gateway itself (`401` from the token check, `429` from throttling) have API Gateway's own body.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: api.example.com
tags:
  - name: Tenants
    description: Business (tenant) registration.
  - name: Services
    description: The services a business offers (US-03).
  - name: Staff
    description: The staff members of a business (US-04).
  - name: Working hours
    description: The weekly working hours and the time off of a staff member (US-05).
security:
  - cognitoJwt: []
paths:
  /tenants:
    post:
      tags:
        - Tenants
      operationId: createTenant
      summary: Create the caller's business
      description: |
        Creates the tenant for the signed-in owner (US-01). One user owns at most one tenant.

        The tenant starts as `provisioning` and becomes `active` once the owner's tenant and role are set on the Cognito user; the response is returned after that. If the Cognito step fails the call returns `503 provisioning_incomplete` and can be repeated: while the tenant is still `provisioning`, a repeated call completes it and may carry a different slug.

        After the response the client must refresh its tokens to get the tenant and role claims.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: The tenant is created and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The slug is taken, the caller already owns an active tenant, or a request with the same Idempotency-Key is still being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slugTaken:
                  value:
                    code: slug_taken
                    message: This slug is already in use.
                tenantAlreadyExists:
                  value:
                    code: tenant_already_exists
                    message: This user already owns a tenant.
                requestInProgress:
                  value:
                    code: request_in_progress
                    message: The same request is still being processed.
        '422':
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_mismatch
                message: This Idempotency-Key was used with a different request.
        '503':
          description: The tenant was stored but could not be activated yet (`provisioning_incomplete`), or the database was too busy (`try_again`). Repeat the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                provisioningIncomplete:
                  value:
                    code: provisioning_incomplete
                    message: Setup is not finished. Try again.
                tryAgain:
                  value:
                    code: try_again
                    message: The service is busy. Try again.
  /services:
    post:
      tags:
        - Services
      operationId: createService
      summary: Create a service
      description: |
        Creates a service for the caller's tenant (US-03). Owner only. `staffIds` (optional) names the staff members who perform it; each must be a staff member of the caller's tenant (US-04). There is no `Idempotency-Key`: repeating the call creates another service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: The service is created and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Services
      operationId: listServices
      summary: List services
      description: |
        Lists the caller's services in creation order, 50 per page by default. Retired services are left out unless `includeInactive` is true. Owner and staff.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: nextToken
          in: query
          required: false
          description: The `nextToken` of the previous page. Opaque; it is only valid for the tenant it was issued to.
          schema:
            type: string
      responses:
        '200':
          description: One page of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
        '400':
          description: A query parameter is not valid, or `nextToken` is malformed or was not issued for the caller's tenant (`invalid_page_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  value:
                    code: validation_failed
                    message: The request is not valid.
                    details:
                      - field: limit
                        issue: too_large
                invalidPageToken:
                  value:
                    code: invalid_page_token
                    message: The page token is not valid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags:
        - Services
      operationId: getService
      summary: Get a service
      description: Returns a service of the caller's tenant, active or not. Owner and staff.
      responses:
        '200':
          description: The service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Services
      operationId: updateService
      summary: Change or retire a service
      description: |
        Changes only the properties that are sent. `active: false` retires the service and `active: true` restores it; there is no delete. Duration plus buffer is checked on the resulting values. `staffIds` replaces the whole set of staff members who perform the service (`[]` empties it); when it is left out the set does not change. Existing appointments keep their own snapshot. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff:
    post:
      tags:
        - Staff
      operationId: createStaffMember
      summary: Create a staff member
      description: |
        Creates a staff member for the caller's tenant (US-04). Owner only. A staff member is a record that appointments are assigned to, not a user account. Which services they perform is set on the service (`staffIds`). There is no `Idempotency-Key`: repeating the call creates another staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: The staff member is created and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Staff
      operationId: listStaff
      summary: List staff
      description: |
        Lists the caller's staff members in creation order, 50 per page by default. Retired members are left out unless `includeInactive` is true. Owner and staff.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: nextToken
          in: query
          required: false
          description: The `nextToken` of the previous page. Opaque; it is only valid for the tenant it was issued to.
          schema:
            type: string
      responses:
        '200':
          description: One page of staff members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '400':
          description: A query parameter is not valid, or `nextToken` is malformed or was not issued for the caller's tenant (`invalid_page_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  value:
                    code: validation_failed
                    message: The request is not valid.
                    details:
                      - field: limit
                        issue: too_large
                invalidPageToken:
                  value:
                    code: invalid_page_token
                    message: The page token is not valid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags:
        - Staff
      operationId: getStaffMember
      summary: Get a staff member
      description: Returns a staff member of the caller's tenant, active or not. Owner and staff.
      responses:
        '200':
          description: The staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Staff
      operationId: updateStaffMember
      summary: Change or retire a staff member
      description: |
        Changes only the properties that are sent. `active: false` retires the staff member and `active: true` restores them; there is no delete. Retiring changes no service and no appointment. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: The updated staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/{staffId}/hours:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags:
        - Working hours
      operationId: getWorkingHours
      summary: Get the weekly working hours
      description: |
        Returns the week of a staff member of the caller's tenant, retired or not. A staff member whose hours were never set has seven empty days, not a `404`: nobody can book them until the owner sets hours. Times are the business's local wall-clock time. Owner and staff.
      responses:
        '200':
          description: The week.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Working hours
      operationId: setWorkingHours
      summary: Replace the weekly working hours
      description: |
        Replaces the whole week. A day that is left out, or `[]`, is a day without work. Times are `HH:MM` in the business's local time on a 5-minute grid; `end` may be `24:00`; an interval never crosses midnight; a lunch break is the gap between two intervals. Owner only. Two simultaneous calls: the last one wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkingHoursRequest'
            example:
              mon:
                - start: '09:00'
                  end: '12:30'
                - start: '13:30'
                  end: '18:00'
              sat:
                - start: '10:00'
                  end: '16:00'
      responses:
        '200':
          description: The week as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
        '400':
          description: |
            The body is missing, null, not valid JSON, or fails validation. Issues: `invalid_format`, `not_a_multiple`, `end_not_after_start`, `overlapping` (also for intervals that touch), `too_many` (more than 4 intervals in a day), `unrecognized` (a day that does not exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: validation_failed
                message: The request is not valid.
                details:
                  - field: mon[1].start
                    issue: overlapping
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/{staffId}/time-off:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    post:
      tags:
        - Working hours
      operationId: addTimeOff
      summary: Add time off
      description: |
        Marks whole days as time off, from `startDate` to `endDate`, both inclusive, as calendar dates in the business's local time. At most 31 days. All days are written or none. A day that is already time off is written again, so repeating a request is safe. Past dates are accepted. No reason is stored (a sick day is health data). Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTimeOffRequest'
      responses:
        '201':
          description: The days of the range, in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffList'
        '400':
          description: |
            The body is missing, null, not valid JSON, or fails validation. Issues: `required`, `invalid_format` (not a real calendar date), `end_before_start`, `too_large` (more than 31 days), `unrecognized`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: validation_failed
                message: The request is not valid.
                details:
                  - field: endDate
                    issue: too_large
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - Working hours
      operationId: listTimeOff
      summary: List time off
      description: |
        Lists the time-off days of a staff member in ascending date order, 50 per page by default. Owner and staff.
      parameters:
        - name: fromDate
          in: query
          required: false
          description: Only this date and later, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: nextToken
          in: query
          required: false
          description: The `nextToken` of the previous page. Opaque; it is only valid for the tenant it was issued to.
          schema:
            type: string
      responses:
        '200':
          description: One page of time-off days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeOffList'
        '400':
          description: A query parameter is not valid (including `fromDate`), or `nextToken` is malformed or was not issued for the caller's tenant (`invalid_page_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /staff/{staffId}/time-off/{date}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
      - name: date
        in: path
        required: true
        description: The day, `YYYY-MM-DD`, in the business's local time.
        schema:
          type: string
          format: date
    delete:
      tags:
        - Working hours
      operationId: removeTimeOff
      summary: Remove one day of time off
      description: |
        Removes the day. A day that is not time off also returns `204`, so repeating the call is safe. The staff member is checked first. Owner only.
      responses:
        '204':
          description: The day is not time off any more.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the Amazon Cognito user pool, validated by the API Gateway JWT authorizer. Clients send the **ID token**, not the access token: only the ID token carries `custom:tenant_id` and `custom:role` (the access token would need a Pre Token Generation trigger). The authorizer checks the issuer and that the audience is the app client.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique value per logical request, for example a UUID. Repeating a request with the same key returns the original result instead of repeating the work.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: Service id (ULID).
      schema:
        type: string
    StaffId:
      name: staffId
      in: path
      required: true
      description: Staff member id (ULID).
      schema:
        type: string
  responses:
    Forbidden:
      description: The caller has no tenant yet (`tenant_required`), or the role may not do this (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tenantRequired:
              value:
                code: tenant_required
                message: Create your business first.
            forbidden:
              value:
                code: forbidden
                message: Your role may not do this.
    NotFound:
      description: No such resource in the caller's tenant. A resource of another tenant looks the same.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found.
    ValidationFailed:
      description: The body is missing, null, not valid JSON, or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_failed
            message: The request is not valid.
            details:
              - field: slug
                issue: reserved
    Unauthorized:
      description: The bearer token is missing, invalid or expired. The body is produced by API Gateway.
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples:
            - validation_failed
        message:
          type: string
          description: Human-readable explanation. It never contains personal data.
        details:
          type: array
          description: Field-level problems, present for validation errors.
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
        - timeZone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Business name, shown on the public booking page.
          examples:
            - Ahmet Berber
        slug:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Public address of the booking page (`/t/{slug}`). Lowercase letters, digits and single hyphens, not starting or ending with a hyphen. Reserved words are rejected. It does not change after the tenant is active.
          examples:
            - ahmet-berber
        timeZone:
          type: string
          description: IANA time zone of the business in `Area/Location` form, used for all availability. The response returns the canonical spelling (for example `europe/istanbul` is stored as `Europe/Istanbul`). UTC offsets and abbreviations such as `+03:00` or `EST` are rejected.
          examples:
            - Europe/Istanbul
    Tenant:
      type: object
      required:
        - id
        - name
        - slug
        - timeZone
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Tenant id (ULID).
        name:
          type: string
        slug:
          type: string
        timeZone:
          type: string
        status:
          type: string
          enum:
            - provisioning
            - active
        createdAt:
          type: string
          format: date-time
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - durationMinutes
        - priceMinor
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown to customers. Trimmed. Names need not be unique.
          examples:
            - Haircut
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          multipleOf: 5
          description: What the customer books. Duration plus buffer is at most 480.
          examples:
            - 30
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
          multipleOf: 5
          default: 0
          description: Extra time kept free after the service (cleaning, preparation). It is not shown to customers.
        priceMinor:
          type: integer
          minimum: 0
          maximum: 100000000
          description: "Price in the smallest unit of the tenant's currency (for TRY, kuruş: 25050 is 250.50)."
          examples:
            - 25050
        staffIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
          description: "Ids of the staff members who perform this service. Each must be a staff member of the caller's tenant, active or not (`unknown_staff` otherwise)."
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          multipleOf: 5
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 60
          multipleOf: 5
        priceMinor:
          type: integer
          minimum: 0
          maximum: 100000000
        active:
          type: boolean
          description: '`false` retires the service; `true` restores it.'
        staffIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
          description: "Replaces the whole set of staff members who perform this service; `[]` empties it. Left out, the set does not change. Ids of staff members who perform this service. Each must be a staff member of the caller's tenant, active or not (`unknown_staff` otherwise)."
    Service:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - bufferMinutes
        - priceMinor
        - active
        - staffIds
        - createdAt
      properties:
        id:
          type: string
          description: Service id (ULID).
        name:
          type: string
        durationMinutes:
          type: integer
        bufferMinutes:
          type: integer
        priceMinor:
          type: integer
        active:
          type: boolean
        staffIds:
          type: array
          items:
            type: string
          description: Ids of the staff members who perform this service. Empty when there are none. Retired members are not removed from it.
        createdAt:
          type: string
          format: date-time
    ServiceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        nextToken:
          type: string
          description: Present when more services follow. Send it back as `nextToken` to get the next page.
    CreateStaffRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown to customers and in the calendar. Trimmed. Names need not be unique.
          examples:
            - Ahmet
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
          description: '`false` retires the staff member; `true` restores them.'
    Staff:
      type: object
      required:
        - id
        - name
        - active
        - createdAt
      properties:
        id:
          type: string
          description: Staff member id (ULID).
        name:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StaffList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        nextToken:
          type: string
          description: Present when more staff members follow. Send it back as `nextToken` to get the next page.
    WorkingInterval:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local time `HH:MM`, a multiple of 5 minutes, `00:00` to `23:55`.
          examples:
            - '09:00'
        end:
          type: string
          pattern: '^(([01]\d|2[0-3]):[0-5]\d|24:00)$'
          description: Local time `HH:MM`, a multiple of 5 minutes, after `start`; `24:00` is the end of the day.
          examples:
            - '18:00'
    SetWorkingHoursRequest:
      type: object
      additionalProperties: false
      description: The days of the week. A day that is left out has no working hours.
      properties:
        mon: &DayIntervals
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/WorkingInterval'
        tue: *DayIntervals
        wed: *DayIntervals
        thu: *DayIntervals
        fri: *DayIntervals
        sat: *DayIntervals
        sun: *DayIntervals
    WorkingHours:
      type: object
      description: The week in the business's local time. Days without work are `[]`.
      required:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      properties:
        mon: *DayIntervals
        tue: *DayIntervals
        wed: *DayIntervals
        thu: *DayIntervals
        fri: *DayIntervals
        sat: *DayIntervals
        sun: *DayIntervals
    AddTimeOffRequest:
      type: object
      additionalProperties: false
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          format: date
          description: First day, local calendar date `YYYY-MM-DD`.
          examples:
            - '2026-11-03'
        endDate:
          type: string
          format: date
          description: Last day, inclusive. Not before `startDate`, at most 31 days in all.
          examples:
            - '2026-11-07'
    TimeOffList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - date
            properties:
              date:
                type: string
                format: date
        nextToken:
          type: string
          description: Present when more days follow. Send it back as `nextToken` to get the next page.
